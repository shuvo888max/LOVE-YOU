<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shuvo's Love Tithi</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0826 0%, #3a0d33 50%, #1a0826 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Floating Animated Hearts Background */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 105, 180, 0.6);
            animation: floatUp linear infinite;
            font-size: 20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 192, 203, 0.2);
            border-radius: 24px;
            padding: 40px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5),
                        0 0 25px rgba(255, 105, 180, 0.2);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Title Styling */
        h1.title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.8rem, 8vw, 4.8rem);
            color: #ff69b4;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.7),
                         0 0 30px rgba(255, 192, 203, 0.4);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: #e0b0ff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Interactive Pulsing Heart */
        .pulse-heart {
            font-size: 60px;
            color: #ff1493;
            display: inline-block;
            margin: 15px 0 30px;
            animation: pulse 1.2s infinite ease-in-out;
            text-shadow: 0 0 20px #ff1493;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .pulse-heart:hover {
            transform: scale(1.2);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* Key Dates Section */
        .dates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .date-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .date-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.12);
            border-color: #ff69b4;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
        }

        .date-card h3 {
            font-size: 1.1rem;
            color: #ffb6c1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date-card p {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* Love Quotes Section */
        .quote-box {
            background: rgba(0, 0, 0, 0.25);
            border-left: 4px solid #ff1493;
            border-radius: 8px;
            padding: 20px 25px;
            margin-top: 20px;
            text-align: italic;
        }

        .quote-text {
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            color: #ffe4e1;
            line-height: 1.6;
            font-style: italic;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quote-author {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ffb6c1;
            font-style: normal;
            font-weight: 600;
        }

        /* Footer */
        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        .footer span {
            color: #ff69b4;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Floating Heart Background Layer -->
    <div class="heart-bg" id="heartBg"></div>

    <!-- Main Content Card -->
    <div class="container">
        <h1 class="title">Shuvo's Love Tithi</h1>
        <p class="subtitle">Forever & Always Bound By Heart</p>

        <div class="pulse-heart" onclick="createHeartBurst(event)">❤️</div>

        <!-- Key Dates -->
        <div class="dates-grid">
            <div class="date-card">
                <h3>💍 Our Engagement</h3>
                <p>05 • 09 • 2025</p>
            </div>
            <div class="date-card">
                <h3>💒 Our Marriage</h3>
                <p>22 • 03 • 2026</p>
            </div>
        </div>

        <!-- Rotating Love Quotes -->
        <div class="quote-box">
            <p class="quote-text" id="quoteDisplay">"In all the world, there is no heart for me like yours. In all the world, there is no love for you like mine."</p>
            <p class="quote-author">— Dedicated to Tithi</p>
        </div>

        <div class="footer">
            Crafted with Infinite Love by <span>Md S H Shuvo</span>
        </div>
    </div>

    <script>
        // Array of Romantic Quotes
        const quotes = [
            `"In all the world, there is no heart for me like yours. In all the world, there is no love for you like mine."`,
            `"I look at you and see the rest of my life in your eyes."`,
            `"Every love story is beautiful, but ours is my absolute favorite, Tithi."`,
            `"From our engagement on 05-09-2025 to our marriage on 22-03-2026 and forever after, my heart belongs to you."`,
            `"You are my today and all of my tomorrows."`
        ];

        let quoteIndex = 0;
        const quoteDisplay = document.getElementById("quoteDisplay");

        // Cycle quotes smoothly every 5 seconds
        setInterval(() => {
            quoteDisplay.style.opacity = 0;
            setTimeout(() => {
                quoteIndex = (quoteIndex + 1) % quotes.length;
                quoteDisplay.textContent = quotes[quoteIndex];
                quoteDisplay.style.opacity = 1;
            }, 500);
        }, 5000);

        // Generate Floating Background Hearts
        const heartBg = document.getElementById("heartBg");
        const heartIcons = ['❤️', '💖', '💗', '💕', '✨'];

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("floating-heart");
            heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
            heart.style.fontSize = (Math.random() * 15 + 15) + "px";
            
            heartBg.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 300);

        // Interactive Heart Click Effect
        function createHeartBurst(e) {
            for (let i = 0; i < 12; i++) {
                const burst = document.createElement("div");
                burst.classList.add("floating-heart");
                burst.textContent = "💖";
                burst.style.left = e.clientX + (Math.random() * 100 - 50) + "px";
                burst.style.top = e.clientY + (Math.random() * 100 - 50) + "px";
                burst.style.animation = "floatUp 2s linear forwards";
                document.body.appendChild(burst);

                setTimeout(() => burst.remove(), 2000);
            }
        }
    </script>
</body>
</html>
