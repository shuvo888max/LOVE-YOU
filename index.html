<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fruit Ninja - Deluxe Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Prevents touch scrolling while slicing */
            user-select: none;
        }
        body {
            background: #110e19;
            color: #FFF;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }
        .ui-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-box {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3;
        }
        canvas {
            width: 100%;
            height: 100%;
            border: 3px solid #FF9900;
            background: radial-gradient(circle, #2c1b30 0%, #0d0a12 100%);
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.3);
            border-radius: 12px;
            display: block;
            cursor: crosshair;
        }
        /* Popup Screen */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 10, 18, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .pop-title {
            font-size: clamp(2rem, 7vw, 3.2rem);
            font-weight: 800;
            color: #FF9900;
            text-shadow: 0 0 20px rgba(255, 153, 0, 0.8);
            margin-bottom: 15px;
        }
        .pop-credit {
            font-size: clamp(0.95rem, 3.2vw, 1.25rem);
            font-weight: 600;
            color: #FF007F;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .start-btn {
            padding: 12px 35px;
            font-size: clamp(1rem, 4vw, 1.3rem);
            font-weight: bold;
            color: #090A0F;
            background: #00FF66;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
            transition: all 0.2s ease-in-out;
        }
        .start-btn:active {
            transform: scale(0.95);
        }
        .instructions {
            margin-top: 10px;
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
        }
        .dev-footer {
            margin-top: 6px;
            color: #FF9900;
            font-size: 0.85rem;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 153, 0, 0.5);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <div class="stat-box" style="color: #FF9900;">SCORE: <span id="score">0</span></div>
        <div class="stat-box" style="color: #FF007F;">LIVES: <span id="lives">3</span></div>
    </div>

    <div class="game-wrapper">
        <div id="startScreen">
            <div class="pop-title">FRUIT SLICER</div>
            <div class="pop-credit">Game Developed BY Md S H Shuvo<br><span style="font-size: 0.85em; color: #FFF;">Student Department Of SWE , DIU</span></div>
            <button class="start-btn" onclick="startGame()">START SLICING</button>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    
    <div class="instructions">Swipe / Drag your mouse or finger to slice fruits!</div>
    <div class="dev-footer">Game Developed BY Md S H Shuvo , Student Department Of SWE , DIU</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startScreen = document.getElementById("startScreen");

        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");

        let gameRunning = false;
        let score = 0;
        let lives = 3;

        let fruits = [];
        let particles = [];
        let slicePath = [];

        // Fruit Definitions
        const fruitTypes = [
            { name: 'Watermelon', color: '#2ECC71', innerColor: '#E74C3C', radius: 35 },
            { name: 'Orange', color: '#E67E22', innerColor: '#F39C12', radius: 28 },
            { name: 'Apple', color: '#E74C3C', innerColor: '#FFD700', radius: 25 },
            { name: 'Lemon', color: '#F1C40F', innerColor: '#FFF', radius: 22 },
            { name: 'Plum', color: '#8E44AD', innerColor: '#9B59B6', radius: 20 }
        ];

        // Track user blade swipe trail
        function addSlicePoint(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const canvasX = (x - rect.left) * scaleX;
            const canvasY = (y - rect.top) * scaleY;

            slicePath.push({ x: canvasX, y: canvasY, time: Date.now() });
            checkSlices(canvasX, canvasY);
        }

        // Event Listeners for PC & Mobile
        let isMouseDown = false;
        window.addEventListener("mousedown", (e) => { isMouseDown = true; addSlicePoint(e.clientX, e.clientY); });
        window.addEventListener("mouseup", () => { isMouseDown = false; });
        window.addEventListener("mousemove", (e) => { if (isMouseDown && gameRunning) addSlicePoint(e.clientX, e.clientY); });

        window.addEventListener("touchstart", (e) => {
            if (!gameRunning) return;
            if (e.touches.length > 0) addSlicePoint(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
            if (!gameRunning) return;
            if (e.touches.length > 0) addSlicePoint(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        function startGame() {
            startScreen.style.display = "none";
            gameRunning = true;
            score = 0;
            lives = 3;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            fruits = [];
            particles = [];
            slicePath = [];
            draw();
        }

        // Spawn Fruit with curved trajectory
        function spawnFruit() {
            const type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            const x = Math.random() * (canvas.width - 200) + 100;
            
            fruits.push({
                x: x,
                y: canvas.height + type.radius,
                vx: (canvas.width / 2 - x) * 0.015 + (Math.random() - 0.5) * 2,
                vy: -(Math.random() * 4 + 13), // Launch force
                gravity: 0.28,
                radius: type.radius,
                color: type.color,
                innerColor: type.innerColor,
                sliced: false,
                halves: []
            });
        }

        // Juice explosion effects
        function createJuiceSplatter(x, y, color) {
            for (let i = 0; i < 16; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1,
                    life: 0.04
                });
            }
        }

        // Check collision between blade trail and fruits
        function checkSlices(x, y) {
            fruits.forEach(fruit => {
                if (!fruit.sliced) {
                    const dist = Math.hypot(fruit.x - x, fruit.y - y);
                    if (dist < fruit.radius) {
                        fruit.sliced = true;
                        score += 10;
                        scoreEl.textContent = score;
                        createJuiceSplatter(fruit.x, fruit.y, fruit.innerColor);

                        // Split into two halves
                        fruit.halves = [
                            { x: fruit.x - 10, y: fruit.y, vx: -3, vy: -3, angle: -0.2 },
                            { x: fruit.x + 10, y: fruit.y, vx: 3, vy: -3, angle: 0.2 }
                        ];
                    }
                }
            });
        }

        function drawBladeTrail() {
            const now = Date.now();
            slicePath = slicePath.filter(p => now - p.time < 150); // Trail lasts 150ms

            if (slicePath.length < 2) return;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(slicePath[0].x, slicePath[0].y);
            for (let i = 1; i < slicePath.length; i++) {
                ctx.lineTo(slicePath[i].x, slicePath[i].y);
            }
            ctx.strokeStyle = "#FFF";
            ctx.lineWidth = 5;
            ctx.shadowColor = "#00F0FF";
            ctx.shadowBlur = 12;
            ctx.lineCap = "round";
            ctx.stroke();
            ctx.restore();
        }

        function draw() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Random Fruit Spawner
            if (Math.random() < 0.025) {
                spawnFruit();
            }

            // Update & Render Fruits
            for (let i = fruits.length - 1; i >= 0; i--) {
                const f = fruits[i];
                
                if (!f.sliced) {
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += f.gravity;

                    // Draw Whole Fruit
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                    ctx.fillStyle = f.color;
                    ctx.shadowColor = f.color;
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    
                    // Inner glow detail
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.radius * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = f.innerColor;
                    ctx.fill();
                    ctx.restore();

                    // Check if fruit fell off bottom screen
                    if (f.y > canvas.height + 50 && f.vy > 0) {
                        fruits.splice(i, 1);
                        lives--;
                        livesEl.textContent = lives;
                        if (lives <= 0) {
                            alert(`GAME OVER!\nFinal Score: ${score}`);
                            document.location.reload();
                        }
                    }
                } else {
                    // Draw Sliced Halves
                    f.halves.forEach(half => {
                        half.x += half.vx;
                        half.y += half.vy;
                        half.vy += f.gravity;

                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(half.x, half.y, f.radius * 0.8, 0, Math.PI);
                        ctx.fillStyle = f.innerColor;
                        ctx.fill();
                        ctx.restore();
                    });

                    // Remove halves once off-screen
                    if (f.halves[0] && f.halves[0].y > canvas.height + 50) {
                        fruits.splice(i, 1);
                    }
                }
            }

            // Update & Render Particle FX
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            drawBladeTrail();

            requestAnimationFrame(draw);
        }
    </script>
</body>
</html>
